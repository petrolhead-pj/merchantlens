<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Touchline — Sportsbook Demo</title>
  <link rel="stylesheet" href="/src/sportsbook.css">
</head>
<body>
  <header class="top">
    <a href="./sportsbook.html" class="wordmark"><span aria-hidden="true">↗</span> TOUCHLINE</a>
    <nav aria-label="Main navigation"><a href="#matches">Sportsbook</a><a href="#wallet">Wallet</a></nav>
    <span class="demo">Simulated funds</span>
  </header>
  <main class="layout">
    <aside class="sports" aria-label="Sports">
      <h2>Sports</h2>
      <button type="button" data-sport="All" aria-pressed="true"><span aria-hidden="true">◈</span> All sports</button>
      <button type="button" data-sport="Football" aria-pressed="false"><span aria-hidden="true">⚽</span> Football</button>
      <button type="button" data-sport="Basketball" aria-pressed="false"><span aria-hidden="true">◉</span> Basketball</button>
      <button type="button" data-sport="Cricket" aria-pressed="false"><span aria-hidden="true">◇</span> Cricket</button>
    </aside>
    <div class="centre">
      <section class="feature" aria-labelledby="feature-heading">
        <div class="pitch" aria-hidden="true"><i></i></div>
        <div class="feature-content">
          <p>Featured fixture · Football</p>
          <h1 id="feature-heading">Harbour City<br><em>vs</em> Northbridge</h1>
          <a href="#matches" id="featured-markets">Explore markets ↗</a>
        </div>
      </section>
      <section id="matches" aria-labelledby="matches-title">
        <div class="matches-header"><h2 id="matches-title">Match centre</h2><span>Demo fixtures</span></div>
        <div class="filters" aria-label="Match status">
          <button type="button" data-phase="All" aria-pressed="true">All matches</button>
          <button type="button" data-phase="Live" aria-pressed="false">Live</button>
          <button type="button" data-phase="Upcoming" aria-pressed="false">Upcoming</button>
        </div>
        <div id="market-list"></div>
      </section>
    </div>
    <aside class="account" aria-label="Bet slip and wallet">
      <section class="panel" aria-labelledby="slip-title">
        <h2 id="slip-title">Bet slip <span id="slip-count">0</span></h2>
        <div id="selection" aria-live="polite"><p>Select odds to preview a pick.</p></div>
        <button type="button" id="clear-pick" hidden>Remove selection</button>
      </section>
      <section class="panel wallet" id="wallet" aria-labelledby="wallet-title">
        <h2 id="wallet-title">Demo wallet</h2>
        <p>Available test balance</p>
        <strong id="balance">₹0</strong>
        <button id="deposit" type="button">Top up demo wallet · ₹500</button>
        <a id="investigation" target="_blank" rel="noopener">Watch this payment in MerchantLens ↗</a>
        <p id="status" role="status"></p>
      </section>
    </aside>
  </main>
  <script type="module" src="/src/sportsbook.js"></script>
</body>
</html>
