AWSTemplateFormatVersion: '2010-09-09'
Description: Standalone account-wide gross cost alerts for the owner to approve before provisioning
Parameters:
  OwnerEmail: {Type: String}
Resources:
  Monthly:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: MerchantLens-Account-Monthly
        BudgetType: COST
        BudgetLimit: {Amount: 10, Unit: USD}
        TimeUnit: MONTHLY
        CostTypes: {IncludeCredit: false}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 5, ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref OwnerEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 8, ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref OwnerEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 10, ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref OwnerEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 10, ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref OwnerEmail}]
